services:
  summarize:
    build: .
    container_name: bbc-summarizer
    ports:
      - "8000:8000"
    environment:
      # docker-compose auto-reads .env (if present) for ${VAR:-default} values;
      # secrets are injected at runtime, never baked into the image.
      - PROVIDER=${PROVIDER:-openrouter}
      - AI_BASE_URL=${AI_BASE_URL:-https://openrouter.ai/api/v1}
      - MODEL=${MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - API_KEY=${API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30.0}
      - SUMMARY_MAX_TOKENS=${SUMMARY_MAX_TOKENS:-180}
      - SUMMARY_TEMPERATURE=${SUMMARY_TEMPERATURE:-0.4}
      - INPUT_MAX_WORDS=${INPUT_MAX_WORDS:-1500}
      - TENACITY_RETRIES=${TENACITY_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    restart: unless-stopped